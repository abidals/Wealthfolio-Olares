apiVersion: v1
kind: Secret
metadata:
  name: wealthfolio-app
  namespace: '{{ .Release.Namespace }}'
  annotations:
    # Keep the generated WF_SECRET_KEY across uninstall so a reinstall can
    # still decrypt data encrypted with the original key. To rotate on purpose,
    # delete this Secret and upgrade — the else branch mints a fresh key.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  WF_SECRET_KEY: {{ include "wealthfolio.secretKey" . | quote }}
  WF_AUTH_PASSWORD_HASH: {{ .Values.olaresEnv.WF_AUTH_PASSWORD_HASH | quote }}
